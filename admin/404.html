<!DOCTYPE html>
<html lang="zh-CN" data-ui-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · OwnUI Admin</title>
<link rel="stylesheet" href="../library/tokens.css">
<link rel="stylesheet" href="../library/base.css">
<link rel="stylesheet" href="../library/components.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="adm">
<div class="adm-veil"></div>

<!-- ==================== 侧栏（与 index.html 一致） ==================== -->
<aside class="adm-side" aria-label="管理侧栏">
  <a class="adm-side__brand" href="index.html">
    <span class="ui-navbar__logo" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="4.55" fill="none" stroke="currentColor" stroke-width="1.9"/></svg>
    </span>
    <span class="adm-brand-text">OwnUI Admin</span>
  </a>

  <div class="adm-side__menu">
    <nav class="ui-sidenav" aria-label="功能菜单">
      <div class="ui-sidenav__group">
        <div class="ui-sidenav__label">总览</div>
        <a class="ui-sidenav__item" href="index.html">
          <svg class="adm-ico" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="6" height="6" rx="1.2"/><rect x="11" y="3" width="6" height="6" rx="1.2"/><rect x="3" y="11" width="6" height="6" rx="1.2"/><rect x="11" y="11" width="6" height="6" rx="1.2"/></svg>
          <span>仪表盘</span>
        </a>
      </div>

      <div class="ui-sidenav__group">
        <div class="ui-sidenav__label">业务</div>
        <a class="ui-sidenav__item" href="users.html">
          <svg class="adm-ico" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="6.5" r="3.2"/><path d="M3.8 16.8c.9-3 3.3-4.6 6.2-4.6s5.3 1.6 6.2 4.6"/></svg>
          <span>用户管理</span>
          <span class="ui-sidenav__badge ui-badge ui-badge--primary ui-badge--pill">12</span>
        </a>
        <a class="ui-sidenav__item" href="forms.html">
          <svg class="adm-ico" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2.8" width="12" height="14.4" rx="1.6"/><path d="M7 7h6M7 10h6M7 13h3.5"/></svg>
          <span>表单页</span>
        </a>
      </div>

      <div class="ui-sidenav__group adm-menu__item">
        <button class="ui-sidenav__item" type="button" data-sub aria-expanded="false">
          <svg class="adm-ico" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 6h14M3 10h14M3 14h14"/><circle cx="7" cy="6" r="1.6" fill="currentColor" stroke="none"/><circle cx="13" cy="10" r="1.6" fill="currentColor" stroke="none"/><circle cx="8" cy="14" r="1.6" fill="currentColor" stroke="none"/></svg>
          <span>系统设置</span>
          <svg class="adm-caret" width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 8l4.5 4.5L14.5 8"/></svg>
        </button>
        <div class="adm-sub">
          <a class="ui-sidenav__item" href="forms.html#basic"><span>常规设置</span></a>
          <a class="ui-sidenav__item" href="forms.html#advanced"><span>安全设置</span></a>
        </div>
      </div>

      <div class="ui-sidenav__group">
        <div class="ui-sidenav__label">页面</div>
        <a class="ui-sidenav__item" href="404.html">
          <svg class="adm-ico" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5L18 16.5H2z"/><path d="M10 8.5v3.6M10 14.4v.2"/></svg>
          <span>404 示例</span>
        </a>
        <a class="ui-sidenav__item" href="login.html">
          <svg class="adm-ico" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 3H16a1 1 0 011 1v12a1 1 0 01-1 1h-3.5"/><path d="M3 10h9M9.5 6.5L13 10l-3.5 3.5"/></svg>
          <span>登录页</span>
        </a>
      </div>

      <div class="ui-sidenav__group">
        <div class="ui-sidenav__label">资源</div>
        <a class="ui-sidenav__item" href="../docs/docs.html">
          <svg class="adm-ico" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4.5C8.6 3.4 6.7 3 4 3v12c2.7 0 4.6.4 6 1.5 1.4-1.1 3.3-1.5 6-1.5V3c-2.7 0-4.6.4-6 1.5z"/><path d="M10 4.5v12"/></svg>
          <span>组件文档</span>
        </a>
      </div>
    </nav>
  </div>

  <div class="adm-side__foot">
    <button class="ui-btn ui-btn--ghost ui-btn--sm" type="button" data-adm-fold>
      <svg class="adm-ico" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="14" height="14" rx="2"/><path d="M8 3v14"/></svg>
      收起侧栏
    </button>
    <span class="adm-side__ver">v1.0.0 · MIT</span>
  </div>
</aside>

<!-- ==================== 主区 ==================== -->
<div class="adm-main">

  <header class="adm-top">
    <button class="ui-icon-btn adm-fold-btn" type="button" data-adm-fold aria-label="折叠侧栏">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 5.5h14M3 10h14M3 14.5h14"/></svg>
    </button>
    <button class="ui-icon-btn adm-burger" type="button" data-adm-drawer aria-label="打开侧栏" aria-expanded="false">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 5.5h14M3 10h14M3 14.5h14"/></svg>
    </button>

    <nav class="ui-breadcrumb" aria-label="面包屑">
      <span class="ui-breadcrumb__item"><a href="index.html">首页</a></span>
      <span class="ui-breadcrumb__sep">/</span>
      <span class="ui-breadcrumb__item" aria-current="page">404</span>
    </nav>

    <div class="adm-top__spacer"></div>

    <div class="adm-top__actions">
      <button class="ui-icon-btn" type="button" data-adm-theme="light" aria-pressed="false" aria-label="切换浅色" data-tooltip="浅色">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="10" cy="10" r="3.5"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M15.3 4.7l-1.4 1.4M6.1 13.9l-1.4 1.4"/></svg>
      </button>
      <button class="ui-icon-btn" type="button" data-adm-theme="dark" aria-pressed="false" aria-label="切换深色" data-tooltip="深色">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 12.2A7 7 0 017.8 3.5a7 7 0 108.7 8.7z"/></svg>
      </button>
    </div>
  </header>

  <main class="adm-content" style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - var(--adm-top-h) * 3)">
    <div class="ui-result ui-result--danger" style="text-align: center">
      <div class="ui-result__glyph" aria-hidden="true" style="font-size: 64px; font-weight: var(--ui-fw-semibold); color: var(--ui-text-3); letter-spacing: .04em">404</div>
      <div class="ui-result__title">页面不存在</div>
      <div class="ui-result__desc">你要找的页面被移除、改名，或者从来没有存在过。<br>检查一下地址，或者回仪表盘看看。</div>
      <div class="ui-result__actions" style="justify-content: center; margin-top: var(--ui-space-5)">
        <a class="ui-btn ui-btn--primary" href="index.html">返回仪表盘</a>
        <a class="ui-btn ui-btn--default" href="../docs/docs.html">查看组件文档</a>
      </div>
    </div>
  </main>

  <footer class="adm-footer">OwnUI Admin · 基于 OwnUI 组件库 · MIT License</footer>
</div>

<script src="../library/components.js"></script>
<script src="admin.js"></script>
</body>
</html>
