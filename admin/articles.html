<!-- 写文章抽屉 -->
<div class="ui-drawer" id="articleDrawer" aria-hidden="true" role="dialog" aria-labelledby="adTitle">
  <div class="ui-drawer__panel" style="width: 460px">
    <div class="ui-drawer__header">
      <div class="ui-modal__title" id="adTitle">写文章</div>
      <button class="ui-modal__close" type="button" data-ui-close aria-label="关闭">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9"/></svg>
      </button>
    </div>
    <div class="ui-drawer__body">
      <form data-ui="validate" novalidate>
        <div class="ui-field" style="margin-bottom: var(--ui-space-4)">
          <label class="ui-field__label" for="a-title">标题 <b aria-hidden="true">*</b></label>
          <input class="ui-input" id="a-title" type="text" placeholder="一句话说清这篇讲什么" data-validate="required">
        </div>
        <div class="ui-field" style="margin-bottom: var(--ui-space-4)">
          <label class="ui-field__label" for="a-cat">分类</label>
          <select class="ui-select" id="a-cat"><option>产品动态</option><option>技术文章</option><option>客户案例</option><option>公告</option></select>
        </div>
        <div class="ui-field" style="margin-bottom: var(--ui-space-4)">
          <label class="ui-field__label" for="a-sum">摘要</label>
          <textarea class="ui-textarea" id="a-sum" rows="2" placeholder="列表与卡片上显示的一小段"></textarea>
        </div>
        <div class="ui-field" style="margin-bottom: var(--ui-space-4)">
          <label class="ui-field__label" for="a-body">正文</label>
          <textarea class="ui-textarea" id="a-body" rows="6" placeholder="支持 Markdown"></textarea>
        </div>
        <div class="ui-switch">
          <input type="checkbox" id="a-pub" checked>
          <span class="ui-switch__track"></span>
          <label class="ui-switch__label" for="a-pub">立即发布</label>
        </div>
      </form>
    </div>
    <div class="ui-drawer__footer">
      <button class="ui-btn ui-btn--default" type="button" data-ui-close>取消</button>
      <button class="ui-btn ui-btn--primary" type="button" data-asave>保存</button>
    </div>
  </div>

  ];
  var state = { q: '', cat: '', view: 'list' };
  var host = document.getElementById('alist');

  function rows() {
    return POSTS.filter(function (p) {
      return (!state.q || p.title.indexOf(state.q) > -1) && (!state.cat || p.cat === state.cat);
    });
  }

  function render() {
    var list = rows();
    if (!list.length) {
      host.innerHTML = '<div class="ui-empty"><div class="ui-empty__title">没有匹配的内容</div><div class="ui-empty__desc">换个关键词或清空筛选</div></div>';
      return;
    }
    if (state.view === 'list') {
      host.innerHTML = '<div class="ui-table-wrap"><table class="ui-table ui-table--compact"><thead><tr>' +
        '<th>标题</th><th>分类</th><th>作者</th><th>浏览</th><th>状态</th><th>更新</th><th style="width:96px">操作</th>' +
        '</tr></thead><tbody>' + list.map(function (p) {
          return '<tr><td><div class="adm-cell-user__name">' + p.title + '</div>' +
            '<div class="adm-cell-user__mail">由 ' + p.author + ' 撰写</div></td>' +
            '<td><span class="ui-badge">' + p.cat + '</span></td>' +
            '<td>' + p.author + '</td>' +
            '<td class="ui-table__cell-num">' + p.views.toLocaleString() + '</td>' +
            '<td>' + (p.status === '已发布'
              ? '<span class="ui-status ui-status--success"><span class="ui-dot"></span>已发布</span>'
              : '<span class="ui-status"><span class="ui-dot"></span>草稿</span>') + '</td>' +
            '<td>' + p.time + '</td>' +
            '<td><div class="ui-row" style="gap:4px">' +
              '<button class="ui-icon-btn ui-icon-btn--sm" type="button" data-edit aria-label="编辑" data-tooltip="编辑"><svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13.8 3.6l2.6 2.6L7 15.6l-3.4.8.8-3.4z"/></svg></button>' +
              '<span class="ui-popconfirm-host"><button class="ui-icon-btn ui-icon-btn--sm" type="button" data-del aria-label="删除" data-tooltip="删除"><svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h12M8 6V4h4v2M6.5 6l.8 10h5.4l.8-10"/></svg></button>' +
              '<span class="ui-popconfirm" hidden><span class="ui-popconfirm__text">删除这篇？</span><button class="ui-btn ui-btn--sm" type="button" data-n>取消</button><button class="ui-btn ui-btn--danger ui-btn--sm" type="button" data-y>删除</button></span></span>' +
            '</div></td></tr>';
        }).join('') + '</tbody></table></div>';
    } else {
      host.innerHTML = '<div class="ui-grid ui-grid--auto ui-grid--tight">' + list.map(function (p) {
        return '<div class="ui-card"><div class="ui-card__body">' +
          '<div class="ui-row" style="margin-bottom: var(--ui-space-3)">' +
            '<span class="ui-avatar ui-avatar--square" aria-hidden="true" style="background: var(--ui-primary-weak); color: var(--ui-primary)">' + p.cat.charAt(0) + '</span>' +
            '<div style="margin-left:auto">' + (p.status === '已发布'
              ? '<span class="ui-badge ui-badge--success">已发布</span>'
              : '<span class="ui-badge">草稿</span>') + '</div>' +
          '</div>' +
          '<div class="adm-cell-user__name" style="margin-bottom: 4px">' + p.title + '</div>' +
          '<div class="ui-caption ui-muted">' + p.cat + ' · ' + p.author + ' · ' + p.time + '</div>' +
          '<div class="ui-row ui-row--between" style="margin-top: var(--ui-space-3)">' +
            '<span class="ui-caption ui-muted">' + p.views.toLocaleString() + ' 次浏览</span>' +
            '<button class="ui-btn ui-btn--ghost ui-btn--sm" type="button" data-edit>编辑</button>' +
          '</div>' +
        '</div></div>';
      }).join('') + '</div>';
    }
  }

  document.getElementById('aq').addEventListener('input', function () { state.q = this.value.trim(); render(); });
  document.getElementById('acat').addEventListener('change', function () { state.cat = this.value; render(); });
  document.getElementById('aview').addEventListener('ui:change', function (e) {
    var seg = e.target.querySelector('[aria-selected="true"]');
    state.view = seg ? seg.getAttribute('data-v') : 'list';
    render();
  });

  host.addEventListener('click', function (e) {
    var edit = e.target.closest('[data-edit]');
    if (edit) {
      if (window.UI && UI.drawer) UI.drawer.open('#articleDrawer');
      return;
    }
    var del = e.target.closest('[data-del]');
    if (del) {
      var pop = del.parentNode.querySelector('.ui-popconfirm');
      pop.hidden = false;
      pop.querySelector('[data-n]').addEventListener('click', function () { pop.hidden = true; }, { once: true });
      pop.querySelector('[data-y]').addEventListener('click', function () {
        var row = del.closest('tr');
        var title = row ? row.querySelector('.adm-cell-user__name').textContent : '';
        var i = POSTS.findIndex(function (p) { return p.title === title; });
        if (i > -1) POSTS.splice(i, 1);
        pop.hidden = true; render();
        if (window.UI) UI.toast({ message: '已删除「' + title + '」', type: 'success' });
      }, { once: true });
    }
  });

  document.querySelector('[data-asave]').addEventListener('click', function () {
    var title = document.getElementById('a-title').value.trim();
    if (!title) { if (window.UI) UI.toast({ message: '标题不能为空', type: 'warning' }); return; }
    POSTS.unshift({ title: title, cat: document.getElementById('a-cat').value, author: '林晚',
      views: 0, status: document.getElementById('a-pub').checked ? '已发布' : '草稿', time: '今天', hue: 'primary' });
    render();
    if (window.UI) { UI.drawer.close('#articleDrawer'); UI.toast({ message: '文章已保存', type: 'success' }); }
  });

  render();
})();
</script>

</body>
</html>
