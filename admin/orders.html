    { id: '#20480', customer: '陈默',   mail: 'mo.chen@example.com',    goods: '专业版月付 × 2',   amount: 329,  pay: '支付宝', status: '待发货', time: '09-25 08:47' },
    { id: '#20479', customer: '苏叶',   mail: 'ye.su@example.com',      goods: '存储扩容包 × 5',   amount: 5600, pay: '对公转账', status: '已完成', time: '09-24 21:05' },
    { id: '#20478', customer: '赵拾光', mail: 'shiguang.zhao@example.com', goods: 'API 调用包 × 1', amount: 96,   pay: '微信', status: '待支付', time: '09-24 14:12' },
    { id: '#20477', customer: '周野',   mail: 'ye.zhou@example.com',    goods: '企业版年费 × 2',   amount: 2568, pay: '支付宝', status: '已退款', time: '09-23 18:33' },
    { id: '#20476', customer: '李清照', mail: 'qz.li@example.com',      goods: '短信包 × 10',      amount: 480,  pay: '微信', status: '已完成', time: '09-23 07:58' },
    { id: '#20475', customer: '顾北',   mail: 'bei.gu@example.com',     goods: '专业版月付 × 1',   amount: 199,  pay: '支付宝', status: '待发货', time: '09-22 10:40' },
    { id: '#20474', customer: '沈书',   mail: 'shu.shen@example.com',   goods: '定制开发定金',      amount: 9800, pay: '对公转账', status: '已完成', time: '09-22 09:02' },
    { id: '#20473', customer: '白鹭',   mail: 'lu.bai@example.com',     goods: 'API 调用包 × 3',   amount: 288,  pay: '微信', status: '待支付', time: '09-21 23:11' },
    { id: '#20472', customer: '江离',   mail: 'li.jiang@example.com',   goods: '存储扩容包 × 1',   amount: 1120, pay: '支付宝', status: '已退款', time: '09-21 09:26' },
    { id: '#20471', customer: '温叙',   mail: 'xu.wen@example.com',     goods: '企业版年费 × 3',   amount: 3852, pay: '对公转账', status: '已完成', time: '09-20 11:15' },
    { id: '#20470', customer: '祁风',   mail: 'feng.qi@example.com',    goods: '专业版月付 × 1',   amount: 199,  pay: '微信', status: '待发货', time: '09-20 12:41' },
    { id: '#20469', customer: '林晚',   mail: 'wan.lin@example.com',    goods: '短信包 × 2',       amount: 96,   pay: '微信', status: '已完成', time: '09-19 16:30' },
    { id: '#20468', customer: '苏叶',   mail: 'ye.su@example.com',      goods: '专业版月付 × 1',   amount: 199,  pay: '支付宝', status: '待发货', time: '09-18 15:08' }
  ];
  var PER = 6;
  var state = { q: '', range: '', status: '', page: 1, sortKey: '', sortDir: 1 };
  var tbody = document.getElementById('obody');
  var pager = document.getElementById('opager');
  var bulk = document.getElementById('obulk');
  var bulkText = bulk.querySelector('[data-obulk-text]');
  var selected = {};

  var STATUS_CLS = { '待支付': 'warning', '待发货': 'info', '已完成': 'success', '已退款': 'danger' };

  function filtered() {
    var rows = ORDERS.filter(function (o) {
      var hit = !state.q || o.id.indexOf(state.q) > -1 || o.customer.indexOf(state.q) > -1;
      var stOk = !state.status || o.status === state.status;
      var day = parseInt(o.time.slice(0, 2), 10);
      var rangeOk = !state.range || (25 - day) < parseInt(state.range, 10);
      return hit && stOk && rangeOk;
    });
    if (state.sortKey) {
      rows = rows.slice().sort(function (a, b) {
        return a[state.sortKey] > b[state.sortKey] ? state.sortDir : a[state.sortKey] < b[state.sortKey] ? -state.sortDir : 0;
      });
    }
    return rows;
  }

  function syncBulk() {
    var ids = Object.keys(selected).filter(function (k) { return selected[k]; });
    bulk.hidden = ids.length === 0;
    bulkText.textContent = '已选中 ' + ids.length + ' 笔订单';
  }

  function render() {
    var rows = filtered();
    var pages = Math.max(1, Math.ceil(rows.length / PER));
    if (state.page > pages) state.page = pages;
    var slice = rows.slice((state.page - 1) * PER, state.page * PER);
    document.getElementById('ocount').textContent = '共 ' + rows.length + ' 笔';
    if (!slice.length) {
      tbody.innerHTML = '<tr><td colspan="8"><div class="ui-empty"><div class="ui-empty__title">没有匹配的订单</div><div class="ui-empty__desc">换个关键词或清空筛选条件</div></div></td></tr>';
    } else {
      tbody.innerHTML = slice.map(function (o) {
        return '<tr data-id="' + o.id + '">' +
          '<td><input type="checkbox" class="ui-check__input o-row" aria-label="选择 ' + o.id + '"' + (selected[o.id] ? ' checked' : '') + '></td>' +
          '<td><div class="adm-cell-user__name ui-mono">' + o.id + '</div><div class="adm-cell-user__mail">' + o.time + '</div></td>' +
          '<td><div class="adm-cell-user"><span class="ui-avatar ui-avatar--sm" aria-hidden="true">' + o.customer.charAt(0) + '</span>' +
            '<div><div class="adm-cell-user__name">' + o.customer + '</div><div class="adm-cell-user__mail">' + o.mail + '</div></div></div></td>' +
          '<td>' + o.goods + '</td>' +
          '<td class="ui-table__cell-num">¥' + o.amount.toLocaleString() + '</td>' +
          '<td><span class="ui-badge">' + o.pay + '</span></td>' +
          '<td><span class="ui-status ui-status--' + STATUS_CLS[o.status] + '"><span class="ui-dot"></span>' + o.status + '</span></td>' +
          '<td><div class="ui-row" style="gap:4px">' +
            '<button class="ui-icon-btn ui-icon-btn--sm" type="button" data-act="view" aria-label="订单详情" data-tooltip="详情">' +
              '<svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 10S5.5 4.8 10 4.8 17.5 10 17.5 10 14.5 15.2 10 15.2 2.5 10 2.5 10z"/><circle cx="10" cy="10" r="2.2"/></svg></button>' +
            (o.status === '待发货' ? '<button class="ui-icon-btn ui-icon-btn--sm" type="button" data-act="ship" aria-label="发货" data-tooltip="发货">' +
              '<svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5.5h9v8H2z"/><path d="M11 8.5h4l2 2.5v2.5h-6z"/><circle cx="5" cy="15" r="1.4"/><circle cx="14" cy="15" r="1.4"/></svg></button>' : '') +
            (o.status !== '已退款' ? '<span class="ui-popconfirm-host"><button class="ui-icon-btn ui-icon-btn--sm" type="button" data-act="refund" aria-label="退款" data-tooltip="退款">' +
              '<svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h11l-3-3"/><path d="M16 11H5l3 3"/></svg></button>' +
              '<span class="ui-popconfirm" hidden><span class="ui-popconfirm__text">确定退款？</span>' +
              '<button class="ui-btn ui-btn--sm" type="button" data-n>取消</button>' +
              '<button class="ui-btn ui-btn--danger ui-btn--sm" type="button" data-y>退款</button></span></span>' : '') +
          '</div></td></tr>';
      }).join('');
    }
    var h = '<span class="ui-pagination__info">第 ' + state.page + ' / ' + pages + ' 页</span>';
    h += '<button class="ui-pagination__item" type="button" data-page="' + Math.max(1, state.page - 1) + '" aria-label="上一页"' + (state.page === 1 ? ' disabled' : '') + '>‹</button>';
    for (var i = 1; i <= pages; i++) h += '<button class="ui-pagination__item" type="button" data-page="' + i + '"' + (i === state.page ? ' aria-current="page"' : '') + '>' + i + '</button>';
    h += '<button class="ui-pagination__item" type="button" data-page="' + Math.min(pages, state.page + 1) + '" aria-label="下一页"' + (state.page === pages ? ' disabled' : '') + '>›</button>';
    pager.innerHTML = h;
  }

  document.getElementById('oq').addEventListener('input', function () { state.q = this.value.trim(); state.page = 1; render(); });
  document.getElementById('orange').addEventListener('change', function () { state.range = this.value; state.page = 1; render(); });
  document.getElementById('ostatus').addEventListener('ui:change', function (e) {
    var seg = e.target.querySelector('[aria-selected="true"]');
    state.status = seg ? seg.getAttribute('data-v') : '';
    state.page = 1; render();
  });
  pager.addEventListener('ui:change', function (e) { state.page = e.detail.page; render(); });
  document.querySelectorAll('#otable .ui-table__sort').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var key = btn.getAttribute('data-sortkey');
      state.sortDir = state.sortKey === key ? -state.sortDir : 1;
      state.sortKey = key;
      document.querySelectorAll('#otable .ui-table__sort').forEach(function (b) { b.setAttribute('aria-sort', 'none'); });
      btn.setAttribute('aria-sort', state.sortDir === 1 ? 'ascending' : 'descending');
      render();
    });
  });

  tbody.addEventListener('change', function (e) {
    if (!e.target.classList.contains('o-row')) return;
    var id = e.target.closest('tr').getAttribute('data-id');
    selected[id] = e.target.checked;
    syncBulk();
  });
  document.getElementById('oall').addEventListener('change', function () {
    var on = this.checked;
    filtered().slice((state.page - 1) * PER, state.page * PER).forEach(function (o) { selected[o.id] = on; });
    render(); syncBulk();
  });

  tbody.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-act]');
    if (!btn) return;
    var id = btn.closest('tr').getAttribute('data-id');
    var o = ORDERS.find(function (x) { return x.id === id; });
    if (btn.getAttribute('data-act') === 'view') return openDrawer(o);
    if (btn.getAttribute('data-act') === 'ship') {
      o.status = '已完成';
      render();
      if (window.UI) UI.toast({ message: o.id + ' 已发货', type: 'success' });
      return;
    }
    if (btn.getAttribute('data-act') === 'refund') {
      var pop = btn.parentNode.querySelector('[data-popconfirm]') || btn.parentNode.querySelector('.ui-popconfirm');
      pop.hidden = false;
      pop.querySelector('[data-n]').addEventListener('click', function () { pop.hidden = true; }, { once: true });
      pop.querySelector('[data-y]').addEventListener('click', function () {
        o.status = '已退款'; pop.hidden = true; render();
        if (window.UI) UI.toast({ message: o.id + ' 已退款', type: 'success' });
      }, { once: true });
    }
  });

  document.querySelectorAll('[data-obulk]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var act = btn.getAttribute('data-obulk');
      var ids = Object.keys(selected).filter(function (k) { return selected[k]; });
      if (!ids.length) return;
      ids.forEach(function (id) {
        var o = ORDERS.find(function (x) { return x.id === id; });
        if (o) o.status = act === 'ship' ? '已完成' : '已退款';
      });
      selected = {}; render(); syncBulk();
      if (window.UI) UI.toast({ message: '已处理 ' + ids.length + ' 笔订单', type: 'success' });
    });
  });
  document.querySelector('[data-ord-export]').addEventListener('click', function () {
    if (window.UI) UI.toast({ message: '已生成 orders.csv（演示，不真下载）', type: 'success' });
  });
  document.querySelector('[data-ord-new]').addEventListener('click', function () {
    if (window.UI) UI.toast({ message: '演示模板：新建订单接你自己的后端接口', type: 'info' });
  });

  function openDrawer(o) {
    document.getElementById('odBody').innerHTML =
      '<div class="ui-desc">' +
        '<div class="ui-desc__item"><span class="ui-desc__label">订单号</span><span class="ui-desc__value"><code class="ui-code">' + o.id + '</code></span></div>' +
        '<div class="ui-desc__item"><span class="ui-desc__label">客户</span><span class="ui-desc__value">' + o.customer + '（' + o.mail + '）</span></div>' +
        '<div class="ui-desc__item"><span class="ui-desc__label">支付方式</span><span class="ui-desc__value">' + o.pay + '</span></div>' +
        '<div class="ui-desc__item"><span class="ui-desc__label">状态</span><span class="ui-desc__value"><span class="ui-status ui-status--' + STATUS_CLS[o.status] + '"><span class="ui-dot"></span>' + o.status + '</span></span></div>' +
      '</div>' +
      '<div class="ui-h4" style="margin: var(--ui-space-5) 0 var(--ui-space-3)">商品明细</div>' +
      '<div class="ui-table-wrap"><table class="ui-table ui-table--compact"><thead><tr><th>商品</th><th>数量</th><th>小计</th></tr></thead><tbody>' +
        '<tr><td>' + o.goods + '</td><td class="ui-table__cell-num">1</td><td class="ui-table__cell-num">¥' + o.amount.toLocaleString() + '</td></tr>' +
      '</tbody></table></div>' +
      '<div class="ui-h4" style="margin: var(--ui-space-5) 0 var(--ui-space-3)">流转记录</div>' +
      '<div class="ui-timeline">' +
        '<div class="ui-timeline__item ui-timeline__item--done"><div class="ui-timeline__rail"><span class="ui-timeline__dot"></span></div><div class="ui-timeline__body"><div class="ui-timeline__title">创建订单 <span class="ui-timeline__time">' + o.time + '</span></div><p class="ui-timeline__desc">客户下单，等待支付</p></div></div>' +
        '<div class="ui-timeline__item ui-timeline__item--' + (o.status === '待支付' ? 'active' : 'done') + '"><div class="ui-timeline__rail"><span class="ui-timeline__dot"></span></div><div class="ui-timeline__body"><div class="ui-timeline__title">支付 <span class="ui-timeline__time">' + o.time + '</span></div><p class="ui-timeline__desc">' + o.pay + '</p></div></div>' +
        '<div class="ui-timeline__item"><div class="ui-timeline__rail"><span class="ui-timeline__dot"></span></div><div class="ui-timeline__body"><div class="ui-timeline__title">发货 <span class="ui-timeline__time">—</span></div><p class="ui-timeline__desc">' + (o.status === '待发货' ? '等待仓库发货' : '已完成') + '</p></div></div>' +
      '</div>';
    if (window.UI && UI.drawer) UI.drawer.open('#orderDrawer');
  }

  render();
})();
</script>
</body>
</html>
