  ];

  var ICON = {
    order: '<path d="M5 3h10l1.5 3.5H3.5z"/><path d="M4.5 6.5V16a1 1 0 001 1h9a1 1 0 001-1V6.5"/><path d="M8 9.5h4"/>',
    warn: '<path d="M10 3.5L18 16.5H2z"/><path d="M10 8.5v3.6M10 14.4v.2"/>',
    chat: '<path d="M16.5 11.5a1.5 1.5 0 01-1.5 1.5H8l-4 3V5a1.5 1.5 0 011.5-1.5h9.5A1.5 1.5 0 0116.5 5z"/>',
    person: '<circle cx="10" cy="7.5" r="2.6"/><path d="M4.8 16.2c.8-2.4 2.7-3.6 5.2-3.6s4.4 1.2 5.2 3.6"/>',
    gear: '<path d="M3 6h14M3 10h14M3 14h14"/><circle cx="7" cy="6" r="1.6" fill="currentColor" stroke="none"/><circle cx="13" cy="10" r="1.6" fill="currentColor" stroke="none"/><circle cx="8" cy="14" r="1.6" fill="currentColor" stroke="none"/>'
  };
  var LEVEL_BG = { success: 'success', warning: 'warning', danger: 'danger', info: 'info' };

  var tabs = document.getElementById('ntabs');
  var panels = {
    all: document.getElementById('np-all'),
    unread: document.getElementById('np-unread'),
    order: document.getElementById('np-order'),
    sys: document.getElementById('np-sys'),
    cmt: document.getElementById('np-cmt'),
    team: document.getElementById('np-team')
  };

  function listHTML(rows) {
    if (!rows.length) {
      return '<div class="ui-empty"><div class="ui-empty__icon"><svg width="28" height="28" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3a5 5 0 015 5v3l1.5 2.5H3.5L5 11V8a5 5 0 015-5z"/><path d="M8.5 16a1.5 1.5 0 003 0"/></svg></div>' +
        '<div class="ui-empty__title">这里空空的</div><div class="ui-empty__desc">该分类下暂时没有消息</div></div>';
    }
    return '<div class="adm-notes">' + rows.map(function (n) {
      return '<div class="adm-note' + (n.unread ? ' is-unread' : '') + '" data-id="' + n.id + '" role="button" tabindex="0">' +
        '<span class="adm-note__icon ui-badge ui-badge--' + LEVEL_BG[n.level] + '">' +
          '<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' + ICON[n.icon] + '</svg></span>' +
        '<div class="adm-note__body">' +
          '<div class="adm-note__top">' +
            '<span class="adm-note__title">' + n.title + '</span>' +
            (n.unread ? '<span class="adm-note__dot" aria-label="未读"></span>' : '') +
          '</div>' +
          '<p class="adm-note__desc">' + n.desc + '</p>' +
          '<div class="adm-note__foot">' +
            '<span class="ui-caption ui-muted">' + n.time + '</span>' +
            '<span class="ui-badge ui-badge--pill adm-note__cat">' + { order: '订单', sys: '系统', cmt: '评论', team: '团队' }[n.cat] + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="adm-note__ops">' +
          (n.unread ? '<button class="ui-btn ui-btn--link ui-btn--sm" type="button" data-act="read">标记已读</button>' : '') +
          '<button class="ui-btn ui-btn--link ui-btn--sm adm-note__del" type="button" data-act="del">删除</button>' +
        '</div>' +
      '</div>';
    }).join('') + '</div>';
  }

  function render() {
    panels.all.innerHTML = listHTML(NOTES);
    panels.unread.innerHTML = listHTML(NOTES.filter(function (n) { return n.unread; }));
    panels.order.innerHTML = listHTML(NOTES.filter(function (n) { return n.cat === 'order'; }));
    panels.sys.innerHTML = listHTML(NOTES.filter(function (n) { return n.cat === 'sys'; }));
    panels.cmt.innerHTML = listHTML(NOTES.filter(function (n) { return n.cat === 'cmt'; }));
    panels.team.innerHTML = listHTML(NOTES.filter(function (n) { return n.cat === 'team'; }));

    var unread = NOTES.filter(function (n) { return n.unread; }).length;
    document.getElementById('nUnread').textContent = unread;
    var c = function (k, v) {
      var el = tabs.querySelector('[data-n-count="' + k + '"]');
      if (el) el.textContent = v;
    };
    c('all', NOTES.length);
    c('unread', unread);
    c('order', NOTES.filter(function (n) { return n.cat === 'order'; }).length);
    c('sys', NOTES.filter(function (n) { return n.cat === 'sys'; }).length);
    c('cmt', NOTES.filter(function (n) { return n.cat === 'cmt'; }).length);
    c('team', NOTES.filter(function (n) { return n.cat === 'team'; }).length);
  }

  tabs.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-act]');
    if (!btn) return;
    var row = btn.closest('.adm-note');
    var id = parseInt(row.getAttribute('data-id'), 10);
    var n = NOTES.find(function (x) { return x.id === id; });
    if (!n) return;
    var act = btn.getAttribute('data-act');
    if (act === 'read') { n.unread = false; render(); }
    if (act === 'del') { NOTES.splice(NOTES.indexOf(n), 1); render(); if (window.UI) UI.toast({ message: '已删除该消息', type: 'success' }); }
  });

  document.querySelector('[data-n-readall]').addEventListener('click', function () {
    var n = NOTES.filter(function (x) { return x.unread; }).length;
    NOTES.forEach(function (x) { x.unread = false; });
    render();
    if (window.UI) UI.toast({ message: '已把 ' + n + ' 条消息标记为已读', type: 'success' });
  });
  document.querySelector('[data-n-clear]').addEventListener('click', function () {
    NOTES.length = 0;
    render();
    if (window.UI) UI.toast({ message: '消息已清空', type: 'success' });
  });

  render();
})();
</script>

  </main>

  <footer class="adm-footer">OwnUI Admin · 基于 OwnUI 组件库 · MIT License</footer>
</div>
