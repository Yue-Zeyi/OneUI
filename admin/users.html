<!-- 新增 / 编辑用户 -->
<div class="ui-modal" id="userModal" aria-hidden="true" role="dialog" aria-labelledby="umTitle">
  <div class="ui-modal__panel" style="max-width: 460px">
    <div class="ui-modal__header">
      <div class="ui-modal__title" id="umTitle">新增用户</div>
      <button class="ui-modal__close" type="button" data-ui-close aria-label="关闭">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9"/></svg>
      </button>
    </div>
    <div class="ui-modal__body">
      <form id="uform" data-ui="validate" novalidate>
        <input type="hidden" id="uf-id">
        <div class="ui-field" style="margin-bottom: var(--ui-space-4)">
          <label class="ui-field__label" for="uf-name">姓名 <b aria-hidden="true">*</b></label>
          <input class="ui-input" id="uf-name" name="name" type="text" placeholder="例如：王小明" data-validate="required">
          <div class="ui-field__help">成员可见的显示名</div>
        </div>
        <div class="ui-field" style="margin-bottom: var(--ui-space-4)">
          <label class="ui-field__label" for="uf-email">邮箱 <b aria-hidden="true">*</b></label>
          <input class="ui-input" id="uf-email" name="email" type="email" placeholder="name@example.com" data-validate="required|email">
          <div class="ui-field__help">用于登录与通知</div>
        </div>
        <div class="ui-field" style="margin-bottom: var(--ui-space-4)">
          <label class="ui-field__label" for="uf-role">角色</label>
          <select class="ui-select" id="uf-role" name="role">
            <option>成员</option><option>运营</option><option>管理员</option>
          </select>
        </div>
        <div class="ui-field" style="margin-bottom: var(--ui-space-2)">
          <span class="ui-field__label">启用账户</span>
          <div class="ui-switch">
            <input type="checkbox" id="uf-active" checked>
            <span class="ui-switch__track"></span>
            <label class="ui-switch__label" for="uf-active">允许登录</label>
          </div>
        </div>
      </form>
    </div>
    <div class="ui-modal__footer">
      <button class="ui-btn ui-btn--default" type="button" data-ui-close>取消</button>
      <button class="ui-btn ui-btn--primary" type="button" id="usave">保存</button>
    </div>
  </div>
</div>

    var rows = USERS.filter(function (u) {
      var hit = !state.q || u.name.indexOf(state.q) > -1 || u.email.toLowerCase().indexOf(state.q.toLowerCase()) > -1;
      var roleOk = !state.role || u.role === state.role;
      var stOk = !state.status || u.status === state.status;
      return hit && roleOk && stOk;
    });
    if (state.sortKey) {
      rows = rows.slice().sort(function (a, b) {
        return a[state.sortKey] > b[state.sortKey] ? state.sortDir : a[state.sortKey] < b[state.sortKey] ? -state.sortDir : 0;
      });
    }
    return rows;
  }

  function statusHtml(s) {
    var cls = s === '启用' ? 'success' : 'danger';
    return '<span class="ui-status ui-status--' + cls + '"><span class="ui-dot"></span>' + s + '</span>';
  }

  function renderPager(total) {
    var pages = Math.max(1, Math.ceil(total / PER));
    if (state.page > pages) state.page = pages;
    var h = '<span class="ui-pagination__info">第 ' + state.page + ' / ' + pages + ' 页</span>';
    h += '<button class="ui-pagination__item" type="button" data-page="' + Math.max(1, state.page - 1) + '" aria-label="上一页"' + (state.page === 1 ? ' disabled' : '') + '>‹</button>';
    for (var i = 1; i <= pages; i++) {
      h += '<button class="ui-pagination__item" type="button" data-page="' + i + '"' + (i === state.page ? ' aria-current="page"' : '') + '>' + i + '</button>';
    }
    h += '<button class="ui-pagination__item" type="button" data-page="' + Math.min(pages, state.page + 1) + '" aria-label="下一页"' + (state.page === pages ? ' disabled' : '') + '>›</button>';
    pager.innerHTML = h;
  }

  function render() {
    var rows = filtered();
    var start = (state.page - 1) * PER;
    var slice = rows.slice(start, start + PER);
    countEl.textContent = '共 ' + rows.length + ' 条';
    if (!slice.length) {
      tbody.innerHTML = '<tr><td colspan="6"><div class="ui-empty"><div class="ui-empty__title">没有匹配的用户</div><div class="ui-empty__desc">换个关键词或清空筛选条件试试</div></div></td></tr>';
    } else {
      tbody.innerHTML = slice.map(function (u) {
        return '<tr data-id="' + u.id + '">' +
          '<td><input type="checkbox" class="ui-check__input u-row-check" aria-label="选择 ' + u.name + '"></td>' +
          '<td><div class="adm-cell-user"><span class="ui-avatar ui-avatar--sm" aria-hidden="true">' + u.name.charAt(0) + '</span>' +
            '<div><div class="adm-cell-user__name">' + u.name + '</div><div class="adm-cell-user__mail">' + u.email + '</div></div></div></td>' +
          '<td>' + (u.role === '管理员' ? '<span class="ui-badge ui-badge--primary">' + u.role + '</span>' : u.role === '运营' ? '<span class="ui-badge">' + u.role + '</span>' : '<span class="ui-text-2">' + u.role + '</span>') + '</td>' +
          '<td>' + statusHtml(u.status) + '</td>' +
          '<td>' + u.created + '</td>' +
          '<td><div class="ui-row" style="gap: 4px">' +
            '<button class="ui-icon-btn ui-icon-btn--sm" type="button" data-act="view" aria-label="查看详情" data-tooltip="详情">' +
              '<svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 10S5.5 4.8 10 4.8 17.5 10 17.5 10 14.5 15.2 10 15.2 2.5 10 2.5 10z"/><circle cx="10" cy="10" r="2.2"/></svg></button>' +
            '<button class="ui-icon-btn ui-icon-btn--sm" type="button" data-act="edit" aria-label="编辑" data-tooltip="编辑">' +
              '<svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13.8 3.6l2.6 2.6L7 15.6l-3.4.8.8-3.4z"/></svg></button>' +
            '<span class="ui-popconfirm-host">' +
              '<button class="ui-icon-btn ui-icon-btn--sm" type="button" data-act="del" aria-label="删除" data-tooltip="删除">' +
                '<svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h12M8 6V4h4v2M6.5 6l.8 10h5.4l.8-10"/></svg></button>' +
              '<span class="ui-popconfirm" data-popconfirm hidden><span class="ui-popconfirm__text">确定删除「' + u.name + '」？</span>' +
                '<button class="ui-btn ui-btn--sm" type="button" data-popcancel>取消</button>' +
                '<button class="ui-btn ui-btn--danger ui-btn--sm" type="button" data-pok>删除</button></span>' +
            '</span>' +
          '</div></td></tr>';
      }).join('');
    }
    renderPager(rows.length);
  }

  /* 工具栏 */
  document.getElementById('uq').addEventListener('input', function () { state.q = this.value.trim(); state.page = 1; render(); });
  document.getElementById('urole').addEventListener('change', function () { state.role = this.value; state.page = 1; render(); });
  document.getElementById('ustatus').addEventListener('ui:change', function (e) {
    var seg = e.target.querySelector('[aria-selected="true"]');
    state.status = seg ? seg.getAttribute('data-v') : '';
    state.page = 1; render();
  });

  /* 分页：ui-pagination 组件点击后在此同步页码重渲染 */
  pager.addEventListener('ui:change', function (e) { state.page = e.detail.page; render(); });

  /* 全选 */
  document.getElementById('uall').addEventListener('change', function () {
    tbody.querySelectorAll('.u-row-check').forEach(function (c) { c.checked = this.checked; }, this);
  });

  /* 排序 */
  document.querySelectorAll('#utable .ui-table__sort').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var key = btn.getAttribute('data-sortkey');
      state.sortDir = state.sortKey === key ? -state.sortDir : 1;
      state.sortKey = key;
      document.querySelectorAll('#utable .ui-table__sort').forEach(function (b) { b.setAttribute('aria-sort', 'none'); });
      btn.setAttribute('aria-sort', state.sortDir === 1 ? 'ascending' : 'descending');
      render();
    });
  });

  /* 行内操作（委托 + 就地删除确认） */
  tbody.addEventListener('click', function (e) {
    var actBtn = e.target.closest('[data-act]');
    if (actBtn) {
      var id = +actBtn.closest('tr').getAttribute('data-id');
      var u = USERS.find(function (x) { return x.id === id; });
      if (actBtn.getAttribute('data-act') === 'view') return openDrawer(u);
      if (actBtn.getAttribute('data-act') === 'edit') return openModal(u);
      if (actBtn.getAttribute('data-act') === 'del') {
        var pop = actBtn.parentNode.querySelector('[data-popconfirm]');
        pop.hidden = false;
        pop.querySelector('[data-popcancel]').addEventListener('click', function () { pop.hidden = true; }, { once: true });
        pop.querySelector('[data-pok]').addEventListener('click', function () {
          USERS.splice(USERS.indexOf(u), 1);
          pop.hidden = true;
          render();
          if (window.UI) UI.toast({ message: '已删除用户「' + u.name + '」', type: 'success' });
        }, { once: true });
      }
    }
  });

  /* 新增 / 编辑弹窗 */
  var modal = document.getElementById('userModal');
  function openModal(u) {
    state.editing = u ? u.id : null;
    document.getElementById('umTitle').textContent = u ? '编辑用户' : '新增用户';
    document.getElementById('uf-id').value = u ? u.id : '';
    document.getElementById('uf-name').value = u ? u.name : '';
    document.getElementById('uf-email').value = u ? u.email : '';
    document.getElementById('uf-role').value = u ? u.role : '成员';
    document.getElementById('uf-active').checked = u ? u.status === '启用' : true;
    if (window.UI && UI.modal) UI.modal.open('#userModal');
  }
  document.querySelector('[data-ui="modal"][data-target="#userModal"]').addEventListener('click', function () { openModal(null); });
  document.getElementById('usave').addEventListener('click', function () {
    var name = document.getElementById('uf-name').value.trim();
    var email = document.getElementById('uf-email').value.trim();
    if (!name || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
      if (window.UI) UI.toast({ message: '请补全姓名与合法邮箱', type: 'warning' });
      return;
    }
    var active = document.getElementById('uf-active').checked ? '启用' : '禁用';
    var role = document.getElementById('uf-role').value;
    var today = new Date();
    var day = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
    if (state.editing) {
      var u = USERS.find(function (x) { return x.id === state.editing; });
      u.name = name; u.email = email; u.role = role; u.status = active;
      if (window.UI) UI.toast({ message: '已保存「' + name + '」的资料', type: 'success' });
    } else {
      USERS.unshift({ id: Date.now(), name: name, email: email, role: role, status: active, created: day, last: '刚刚' });
      if (window.UI) UI.toast({ message: '已创建用户「' + name + '」', type: 'success' });
    }
    if (window.UI && UI.modal) UI.modal.close('#userModal');
    state.page = 1; render();
  });

  /* 详情抽屉 */
  function openDrawer(u) {
    document.getElementById('udBody').innerHTML =
      '<div class="ui-row" style="gap: var(--ui-space-3); margin-bottom: var(--ui-space-5)">' +
        '<span class="ui-avatar" aria-hidden="true">' + u.name.charAt(0) + '</span>' +
        '<div><div class="adm-cell-user__name" style="font-size: var(--ui-fs-15)">' + u.name + '</div>' +
        '<div class="adm-cell-user__mail">' + u.email + '</div></div></div>' +
      '<div class="ui-desc">' +
        '<div class="ui-desc__item"><span class="ui-desc__label">角色</span><span class="ui-desc__value">' + u.role + '</span></div>' +
        '<div class="ui-desc__item"><span class="ui-desc__label">状态</span><span class="ui-desc__value">' + statusHtml(u.status) + '</span></div>' +
        '<div class="ui-desc__item"><span class="ui-desc__label">注册时间</span><span class="ui-desc__value">' + u.created + '</span></div>' +
        '<div class="ui-desc__item"><span class="ui-desc__label">最近登录</span><span class="ui-desc__value">' + u.last + '</span></div>' +
        '<div class="ui-desc__item"><span class="ui-desc__label">用户 ID</span><span class="ui-desc__value"><code class="ui-code">' + u.id + '</code></span></div>' +
      '</div>';
    if (window.UI && UI.drawer) UI.drawer.open('#userDrawer');
  }

  render();
})();
</script>
</body>
</html>
